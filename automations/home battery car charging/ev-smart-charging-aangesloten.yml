alias: EV Smart Charging - auto aangesloten
description: >-
  Houdt switch.ev_smart_charging_ev_connected gelijk aan de Wallbox-status, zodat
  de prijsplanner weet of de auto aangesloten is. Stuurt de laadpaal zelf niet aan.
  Bij unknown/unavailable blijft de vorige stand staan.
triggers:
  - trigger: state
    entity_id: sensor.wallbox_portal_status_description
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: >-
      {{ states('sensor.wallbox_portal_status_description') not in ['unknown', 'unavailable', ''] }}
actions:
  - choose:
      # Geen auto aangesloten
      - conditions:
          - condition: state
            entity_id: sensor.wallbox_portal_status_description
            state:
              - Ready
              - Disconnected
              - Locked
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.ev_smart_charging_ev_connected
    # Elke andere status (Charging, Paused, Connected, ...) → auto aangesloten
    default:
      - action: switch.turn_on
        target:
          entity_id: switch.ev_smart_charging_ev_connected
mode: queued
